name: Sync upstream ARMSX2 + build iOS 16 (v3 workflow-safe)

on:
  schedule:
    # Every 6 hours. The cheap Linux sync check runs each time; the macOS iOS
    # build is dispatched only when upstream/master actually changed.
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Build iOS 16 even if the fork is already synced'
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: armsx2-upstream-sync-ios16
  cancel-in-progress: false

jobs:
  sync:
    name: Sync ARMSX2 upstream master
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork master with full history
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Configure Git
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        shell: bash
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/ARMSX2/ARMSX2.git
          git fetch --prune upstream master

      - name: Check for upstream source changes and sync safely
        id: sync
        shell: bash
        run: |
          set -euo pipefail

          LOCAL_BEFORE="$(git rev-parse HEAD)"
          UPSTREAM_HEAD="$(git rev-parse upstream/master)"

          echo "local_before=$LOCAL_BEFORE" >> "$GITHUB_OUTPUT"
          echo "upstream_head=$UPSTREAM_HEAD" >> "$GITHUB_OUTPUT"

          echo "Fork master before sync: $LOCAL_BEFORE"
          echo "Upstream master:          $UPSTREAM_HEAD"

          # The fork owns .github/workflows.  GitHub's built-in Actions token
          # cannot push commits which introduce/update workflow files from
          # upstream, so never import upstream's workflow directory.
          #
          # This also protects:
          #   .github/workflows/build-ios16.yml
          #   .github/workflows/sync-upstream-ios16.yml
          #
          # All non-workflow repository files are mirrored to upstream/master.

          if git cat-file -e upstream/master:.github/workflows/build-ios16.yml 2>/dev/null; then
            echo "ERROR: upstream now contains .github/workflows/build-ios16.yml." >&2
            echo "Stopping so the fork-owned iOS 16 workflow can be reviewed manually." >&2
            exit 1
          fi

          # Compare only the part of the tree we actually mirror.
          if git diff --quiet HEAD upstream/master -- . ':(exclude).github/workflows/**'; then
            echo "Fork source already matches current upstream/master."
            echo "Upstream workflow-only differences, if any, are intentionally ignored."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "local_after=$LOCAL_BEFORE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Upstream source changes detected."
          echo "Files which will change in the fork (workflow files excluded):"
          git diff --name-status HEAD upstream/master -- . ':(exclude).github/workflows/**' || true

          # Mirror the upstream snapshot WITHOUT importing upstream commit
          # history.  This is important: if we merged/cherry-picked upstream
          # commits which touched .github/workflows, GitHub would reject the
          # push even if a later commit restored our workflow files.
          #
          # git restore also handles upstream additions and deletions.
          git restore \
            --source=upstream/master \
            --staged \
            --worktree \
            -- . ':(exclude).github/workflows/**'

          # Guardrails: our two fork-owned workflows must still exist and must
          # not be staged for modification by this source sync.
          for required in \
            .github/workflows/build-ios16.yml \
            .github/workflows/sync-upstream-ios16.yml
          do
            if [ ! -f "$required" ]; then
              echo "ERROR: required fork workflow disappeared: $required" >&2
              exit 1
            fi
          done

          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo "ERROR: source sync unexpectedly staged a workflow-file change." >&2
            git diff --cached --name-status -- .github/workflows || true
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "No non-workflow changes remained after snapshot sync."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "local_after=$LOCAL_BEFORE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Sync ARMSX2 upstream source ${UPSTREAM_HEAD:0:12}"

          LOCAL_AFTER="$(git rev-parse HEAD)"
          echo "local_after=$LOCAL_AFTER" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

          echo "Created workflow-safe source sync commit: $LOCAL_AFTER"
          echo "Pushing fork-owned source snapshot (no .github/workflows changes)..."
          git push origin HEAD:master

      - name: Dispatch the iOS 16 compatibility build
        if: steps.sync.outputs.changed == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_build)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Dispatching .github/workflows/build-ios16.yml in fork: $GITHUB_REPOSITORY"
          gh workflow run build-ios16.yml --repo "$GITHUB_REPOSITORY" --ref master

          echo "### ARMSX2 workflow-safe upstream sync" >> "$GITHUB_STEP_SUMMARY"
          echo "- Previous fork head: \`${{ steps.sync.outputs.local_before }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Upstream head: \`${{ steps.sync.outputs.upstream_head }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Synced fork head: \`${{ steps.sync.outputs.local_after }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Upstream `.github/workflows/`: **intentionally preserved from fork**" >> "$GITHUB_STEP_SUMMARY"
          echo "- iOS 16 compatibility build: **dispatched**" >> "$GITHUB_STEP_SUMMARY"

      - name: Summary when already current and no build requested
        if: steps.sync.outputs.changed == 'false' && !(github.event_name == 'workflow_dispatch' && inputs.force_build)
        shell: bash
        run: |
          echo "### ARMSX2 workflow-safe upstream sync" >> "$GITHUB_STEP_SUMMARY"
          echo "Fork source already matches upstream/master (upstream workflow differences are intentionally ignored)." >> "$GITHUB_STEP_SUMMARY"
          echo "No macOS iOS build was started." >> "$GITHUB_STEP_SUMMARY"
