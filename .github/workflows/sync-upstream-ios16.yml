name: Sync upstream ARMSX2 + build iOS 16 (v4 revision-tracked)

on:
  schedule:
    # Check upstream/master every 6 hours.
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Build iOS 16 even if this upstream revision was already built'
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: armsx2-upstream-sync-ios16
  cancel-in-progress: false

jobs:
  sync:
    name: Track latest ARMSX2 upstream revision
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork master with full history
        uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Configure Git
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        shell: bash
        run: |
          set -euo pipefail
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/ARMSX2/ARMSX2.git
          git fetch --prune upstream master

      - name: Compare upstream revision and sync source safely
        id: sync
        shell: bash
        run: |
          set -euo pipefail

          MARKER_FILE=".armsx2-ios16-last-built-upstream"

          LOCAL_BEFORE="$(git rev-parse HEAD)"
          UPSTREAM_HEAD="$(git rev-parse upstream/master)"

          echo "local_before=$LOCAL_BEFORE" >> "$GITHUB_OUTPUT"
          echo "upstream_head=$UPSTREAM_HEAD" >> "$GITHUB_OUTPUT"

          echo "Fork master before sync: $LOCAL_BEFORE"
          echo "Upstream master:          $UPSTREAM_HEAD"

          # -----------------------------------------------------------------
          # Fork-owned paths.
          #
          # We intentionally never mirror upstream's workflow directory.
          # GitHub's built-in Actions token can be rejected when a GitHub App
          # tries to push upstream workflow-file changes into the fork.
          #
          # V4 also owns one tiny root marker file which remembers the exact
          # upstream/master SHA most recently dispatched to build-ios16.yml.
          # -----------------------------------------------------------------
          for fork_owned in \
            .github/workflows/build-ios16.yml \
            .github/workflows/sync-upstream-ios16.yml \
            "$MARKER_FILE"
          do
            if git cat-file -e "upstream/master:$fork_owned" 2>/dev/null; then
              echo "ERROR: upstream now contains fork-owned path: $fork_owned" >&2
              echo "Stopping for manual review instead of overwriting fork-owned state." >&2
              exit 1
            fi
          done

          LAST_BUILT=""
          if [ -f "$MARKER_FILE" ]; then
            LAST_BUILT="$(tr -d '[:space:]' < "$MARKER_FILE")"
          fi

          if [ -n "$LAST_BUILT" ] && ! printf '%s' "$LAST_BUILT" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "WARNING: $MARKER_FILE contains an invalid SHA; treating it as unset."
            LAST_BUILT=""
          fi

          if [ -n "$LAST_BUILT" ]; then
            echo "Last upstream revision dispatched: $LAST_BUILT"
            echo "last_built=$LAST_BUILT" >> "$GITHUB_OUTPUT"
          else
            echo "No valid previous upstream-build marker exists yet."
            echo "last_built=none" >> "$GITHUB_OUTPUT"
          fi

          if [ "$LAST_BUILT" = "$UPSTREAM_HEAD" ]; then
            REVISION_NEW=false
            echo "This exact upstream revision was already dispatched previously."
          else
            REVISION_NEW=true
            echo "New upstream revision detected for iOS build tracking."
          fi
          echo "revision_new=$REVISION_NEW" >> "$GITHUB_OUTPUT"

          # -----------------------------------------------------------------
          # Mirror every NON-WORKFLOW upstream source change while preserving
          # the fork-owned revision marker.
          # -----------------------------------------------------------------
          if git diff --quiet HEAD upstream/master -- \
              . \
              ':(exclude).github/workflows/**' \
              ':(exclude).armsx2-ios16-last-built-upstream'
          then
            echo "Fork source already matches upstream/master."
            echo "source_changed=false" >> "$GITHUB_OUTPUT"
            echo "local_after=$LOCAL_BEFORE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Upstream source changes detected."
          echo "Files which will change in the fork (workflow + marker excluded):"
          git diff --name-status HEAD upstream/master -- \
            . \
            ':(exclude).github/workflows/**' \
            ':(exclude).armsx2-ios16-last-built-upstream' || true

          # Snapshot-mirror upstream source WITHOUT importing upstream commit
          # history. This is what keeps upstream workflow commits out of the
          # push while still handling additions, modifications and deletions.
          git restore \
            --source=upstream/master \
            --staged \
            --worktree \
            -- \
            . \
            ':(exclude).github/workflows/**' \
            ':(exclude).armsx2-ios16-last-built-upstream'

          # Guardrails.
          for required in \
            .github/workflows/build-ios16.yml \
            .github/workflows/sync-upstream-ios16.yml
          do
            if [ ! -f "$required" ]; then
              echo "ERROR: required fork workflow disappeared: $required" >&2
              exit 1
            fi
          done

          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo "ERROR: source sync unexpectedly staged a workflow-file change." >&2
            git diff --cached --name-status -- .github/workflows || true
            exit 1
          fi

          if git diff --cached --name-only | grep -q '^\.armsx2-ios16-last-built-upstream$'; then
            echo "ERROR: source sync unexpectedly staged the V4 revision marker." >&2
            exit 1
          fi

          if git diff --cached --quiet; then
            echo "No non-workflow changes remained after snapshot sync."
            echo "source_changed=false" >> "$GITHUB_OUTPUT"
            echo "local_after=$LOCAL_BEFORE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "Sync ARMSX2 upstream source ${UPSTREAM_HEAD:0:12}"

          LOCAL_AFTER="$(git rev-parse HEAD)"
          echo "local_after=$LOCAL_AFTER" >> "$GITHUB_OUTPUT"
          echo "source_changed=true" >> "$GITHUB_OUTPUT"

          echo "Created workflow-safe source sync commit: $LOCAL_AFTER"
          echo "Pushing fork source snapshot..."
          git push origin HEAD:master

      - name: Dispatch latest iOS 16 build
        id: dispatch
        if: >
          steps.sync.outputs.revision_new == 'true' ||
          steps.sync.outputs.source_changed == 'true' ||
          (github.event_name == 'workflow_dispatch' && inputs.force_build)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Dispatching fork workflow:"
          echo "  repo:     $GITHUB_REPOSITORY"
          echo "  workflow: build-ios16.yml"
          echo "  ref:      master"
          echo "  upstream: ${{ steps.sync.outputs.upstream_head }}"

          gh workflow run build-ios16.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref master

          echo "dispatch_succeeded=true" >> "$GITHUB_OUTPUT"

      - name: Record upstream revision after successful dispatch
        if: steps.dispatch.outputs.dispatch_succeeded == 'true'
        shell: bash
        run: |
          set -euo pipefail

          MARKER_FILE=".armsx2-ios16-last-built-upstream"
          UPSTREAM_HEAD="${{ steps.sync.outputs.upstream_head }}"

          printf '%s\n' "$UPSTREAM_HEAD" > "$MARKER_FILE"
          git add "$MARKER_FILE"

          if git diff --cached --quiet; then
            echo "Revision marker already records $UPSTREAM_HEAD."
          else
            git commit -m "Record iOS 16 build dispatch ${UPSTREAM_HEAD:0:12}"
            git push origin HEAD:master
            echo "Recorded upstream build revision: $UPSTREAM_HEAD"
          fi

      - name: Summary when build dispatched
        if: steps.dispatch.outputs.dispatch_succeeded == 'true'
        shell: bash
        run: |
          {
            echo "### ARMSX2 V4 revision-tracked upstream sync"
            echo ""
            echo "- Previous built upstream revision: \`${{ steps.sync.outputs.last_built }}\`"
            echo "- Current upstream revision: \`${{ steps.sync.outputs.upstream_head }}\`"
            echo "- New upstream revision: **${{ steps.sync.outputs.revision_new }}**"
            echo "- Fork source changed during sync: **${{ steps.sync.outputs.source_changed }}**"
            echo "- Upstream \`.github/workflows/\`: **intentionally preserved from fork**"
            echo "- \`build-ios16.yml\`: **automatically dispatched ✅**"
            echo "- V4 revision marker: **updated after successful dispatch ✅**"
            echo ""
            echo "GitHub may label the resulting build as 'Manually run by github-actions[bot]'."
            echo "That still means this sync workflow launched it automatically."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary when latest revision is already built
        if: >
          steps.dispatch.outcome == 'skipped' &&
          steps.sync.outputs.revision_new == 'false' &&
          steps.sync.outputs.source_changed == 'false'
        shell: bash
        run: |
          {
            echo "### ARMSX2 V4 revision-tracked upstream sync"
            echo ""
            echo "- Current upstream revision: \`${{ steps.sync.outputs.upstream_head }}\`"
            echo "- Last built upstream revision: \`${{ steps.sync.outputs.last_built }}\`"
            echo "- Fork source: **already current**"
            echo "- iOS build: **already refreshed for this exact upstream revision — skipped ✅**"
            echo "- Next new upstream/master revision will automatically dispatch \`build-ios16.yml\`."
          } >> "$GITHUB_STEP_SUMMARY"
