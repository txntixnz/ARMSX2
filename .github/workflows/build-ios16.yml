name: Build ARMSX2 for iOS 16 (compat v9.3.1 analog tuning UI hotfix)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios16:
    name: iOS 16 compatibility build
    runs-on: macos-26

    steps:
      - name: Checkout ARMSX2
        uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Patch deployment target and iOS 17 Swift Observation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('platforms/ios/app/src/main/swift')
          cmake = Path('platforms/ios/app/src/main/cpp/CMakeLists.txt')

          # 1) Real Mach-O deployment target: iOS 16.0.
          s = cmake.read_text()
          old = 'set(ARMSX2_IOS_DEPLOYMENT_TARGET "17.0" CACHE STRING "Minimum iOS deployment target")'
          new = 'set(ARMSX2_IOS_DEPLOYMENT_TARGET "16.0" CACHE STRING "Minimum iOS deployment target")'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('ARMSX2 iOS deployment-target line changed upstream; refusing blind patch.')
          cmake.write_text(s)

          observable_classes = {
              'AppState',
              'FileImportHandler',
              'CoverStore',
              'DynamicThumbstickSettings',
              'EmulatorBridge',
              'SettingsStore',
              'ExternalGameLibrary',
              'PatchStore',
              'FrameTimeDynamicResolutionController',
              'InitialContentBootstrap',
              'VPadSkinLibraryStore',
              'PadLayoutPresetStore',
              'PadLayoutStore',
              'DynamicCrosshairRuntimeState',
          }

          def brace_delta(line: str) -> int:
              # Good enough for these Swift declarations; comments/strings are ignored deliberately.
              return line.count('{') - line.count('}')

          def add_observableobject_conformance(line: str, class_name: str) -> str:
              if 'ObservableObject' in line:
                  return line
              # Only touch the declaration for the class which had @Observable.
              if not re.search(r'\bclass\s+' + re.escape(class_name) + r'\b', line):
                  return line
              brace = line.rfind('{')
              if brace < 0:
                  return line
              head, tail = line[:brace].rstrip(), line[brace:]
              # Swift inheritance/conformance list.
              if ':' in head:
                  head = head.replace(':', ': ObservableObject,', 1)
              else:
                  head += ': ObservableObject'
              return head + ' ' + tail

          def should_publish(line: str, ignored: bool) -> bool:
              if ignored:
                  return False
              stripped = line.strip()
              if not stripped or stripped.startswith('//') or stripped.startswith('@'):
                  return False
              if '@Published' in stripped:
                  return False
              if re.search(r'\b(static|class|lazy)\s+var\b', stripped):
                  return False
              # Class-level stored vars only. Modifiers such as private(set), nonisolated, etc. are allowed.
              if not re.match(r'^(?:(?:public|private|fileprivate|internal|package|open|final|nonisolated|isolated|weak|unowned|private\(set\)|public\(set\)|internal\(set\))\s+)*var\s+[A-Za-z_][A-Za-z0-9_]*', stripped):
                  return False
              # A declaration with a body and no initializer is computed, not stored.
              eq = stripped.find('=')
              br = stripped.find('{')
              if br >= 0 and (eq < 0 or br < eq):
                  return False
              return True

          converted = []
          published = 0

          for path in root.rglob('*.swift'):
              original = path.read_text()
              if '@Observable' not in original and '@ObservationIgnored' not in original:
                  continue

              lines = original.splitlines()
              # Locate each @Observable and the immediately following class declaration.
              targets = []
              for i, line in enumerate(lines):
                  if '@Observable' not in line:
                      continue
                  for j in range(i, min(i + 8, len(lines))):
                      m = re.search(r'\bclass\s+([A-Za-z_][A-Za-z0-9_]*)\b', lines[j])
                      if m:
                          targets.append((i, j, m.group(1)))
                          break

              if not targets:
                  continue

              # Remove Observation annotations but remember fields explicitly ignored by upstream.
              ignored_property_lines = set()
              skip_next_property = False
              for i, line in enumerate(lines):
                  if '@ObservationIgnored' in line:
                      if re.search(r'\bvar\b', line):
                          ignored_property_lines.add(i)
                      else:
                          skip_next_property = True
                      lines[i] = line.replace('@ObservationIgnored', '')
                      continue
                  if skip_next_property and re.search(r'\bvar\b', line):
                      ignored_property_lines.add(i)
                      skip_next_property = False

              # Remove @Observable token/line and alter declarations.
              for ann_i, decl_i, name in targets:
                  if name not in observable_classes:
                      raise SystemExit(f'Unexpected @Observable class {name} in {path}; inspect upstream before continuing.')
                  lines[ann_i] = lines[ann_i].replace('@Observable', '')
                  lines[decl_i] = add_observableobject_conformance(lines[decl_i], name)
                  converted.append(name)

                  # Mark stored properties in this class @Published. Track relative brace depth.
                  depth = 0
                  entered = False
                  for k in range(decl_i, len(lines)):
                      line = lines[k]
                      if k == decl_i:
                          depth += brace_delta(line)
                          entered = depth > 0
                          continue
                      if not entered:
                          depth += brace_delta(line)
                          entered = depth > 0
                          continue
                      # Directly inside the class body => relative depth 1.
                      if depth == 1 and should_publish(line, k in ignored_property_lines):
                          indent = line[:len(line) - len(line.lstrip())]
                          lines[k] = indent + '@Published ' + line.lstrip()
                          published += 1
                      depth += brace_delta(line)
                      if depth <= 0:
                          break

              text = '\n'.join(lines) + ('\n' if original.endswith('\n') else '')
              # Combine owns ObservableObject / @Published / @ObservedObject.
              if 'import Combine' not in text:
                  imports = list(re.finditer(r'^import\s+[^\n]+$', text, flags=re.M))
                  if imports:
                      pos = imports[-1].end()
                      text = text[:pos] + '\nimport Combine' + text[pos:]
                  else:
                      text = 'import Combine\n' + text
              # Observation is no longer used in converted model files.
              text = re.sub(r'^import Observation\s*\n', '', text, flags=re.M)
              path.write_text(text)

          # 2) SwiftUI bindings: @Bindable is iOS 17. @ObservedObject works with converted SettingsStore.
          bindable_replacements = 0
          stateobject_replacements = 0
          shared_observer_replacements = 0
          for path in root.rglob('*.swift'):
              text = path.read_text()
              n = text.count('@Bindable')
              if n:
                  text = text.replace('@Bindable', '@ObservedObject')
                  bindable_replacements += n
                  if 'import Combine' not in text and 'import SwiftUI' not in text:
                      text = 'import SwiftUI\n' + text

              # Convert the common directly-created observable model pattern from @State to @StateObject.
              # Only direct ClassName(...) initializers are changed, avoiding custom init wiring.
              for cls in observable_classes:
                  pat = re.compile(r'@State(?P<mods>\s+(?:(?:private|fileprivate|internal|public)\s+)?)var(?P<body>\s+[A-Za-z_][A-Za-z0-9_]*\s*(?::\s*' + re.escape(cls) + r')?\s*=\s*' + re.escape(cls) + r'\s*\()')
                  text, c = pat.subn(lambda m: '@StateObject' + (m.group('mods') or ' ') + 'var' + m.group('body'), text)
                  stateobject_replacements += c

                  # iOS 17's Observation framework supports `@State var model = Model.shared`
                  # and automatically tracks changes inside that @Observable reference.
                  # Once Model is backported to ObservableObject for iOS 16, @State only
                  # tracks replacement of the reference and does NOT subscribe to objectWillChange.
                  # This is exactly the menu->game symptom seen in the field: the VM starts and
                  # audio runs, but SwiftUI never redraws RootView to present gameplay.
                  # For a DIRECT singleton reference, @ObservedObject is the correct iOS 16 equivalent.
                  # Important: do not match member values such as
                  # `SettingsStore.shared.dynamicAppearancePreferences`; that value is not
                  # necessarily an ObservableObject and must keep its original wrapper.
                  shared_pat = re.compile(
                      r'@State(?P<mods>\s+(?:(?:private|fileprivate|internal|public)\s+)?)'
                      r'var(?P<body>\s+[A-Za-z_][A-Za-z0-9_]*\s*(?::\s*' + re.escape(cls) + r')?\s*=\s*'
                      + re.escape(cls) + r'\.shared\b(?=[ \t]*(?://[^\n]*)?(?:\n|$)))'
                  )
                  text, c = shared_pat.subn(
                      lambda m: '@ObservedObject' + (m.group('mods') or ' ') + 'var' + m.group('body'),
                      text
                  )
                  shared_observer_replacements += c
              path.write_text(text)

          print('Converted @Observable classes:', ', '.join(sorted(set(converted))))
          print('Added @Published to stored properties:', published)
          print('Replaced @Bindable:', bindable_replacements)
          print('Converted direct @State model owners to @StateObject:', stateobject_replacements)
          print('Converted @State singleton observable refs to @ObservedObject:', shared_observer_replacements)
          missing = observable_classes - set(converted)
          if missing:
              print('NOTE: expected classes not seen in this checkout:', ', '.join(sorted(missing)))
          PY

      - name: Verify iOS 16 Observation wiring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('platforms/ios/app/src/main/swift')
          problems = []
          interesting = []

          for path in root.rglob('*.swift'):
              text = path.read_text()
              # AppState is the route source of truth. It must have been converted to
              # ObservableObject and the currentScreen route must publish on iOS 16.
              if path.name == 'AppState.swift':
                  if 'ObservableObject' not in text:
                      problems.append('AppState.swift is not ObservableObject')
                  if not re.search(r'@Published\s+[^\n]*\bvar\s+currentScreen\b', text):
                      problems.append('AppState.currentScreen is not @Published')

              # Any leftover Observation-style @State singleton ref would not subscribe
              # to ObservableObject.objectWillChange on iOS 16.
              for n, line in enumerate(text.splitlines(), 1):
                  if re.search(r'@State\b[^\n]*=\s*(?:AppState|SettingsStore|DynamicThumbstickSettings|EmulatorBridge|ExternalGameLibrary|PatchStore|FrameTimeDynamicResolutionController|InitialContentBootstrap|VPadSkinLibraryStore|PadLayoutPresetStore|PadLayoutStore|CoverStore|FileImportHandler)\.shared\b[ \t]*(?://.*)?$', line):
                      problems.append(f'{path}:{n}: unconverted singleton @State: {line.strip()}')
                  if 'AppState.shared' in line and ('@ObservedObject' in line or '@StateObject' in line):
                      interesting.append(f'{path}:{n}: {line.strip()}')

          print('Observed AppState singleton wiring after iOS 16 backport:')
          if interesting:
              for item in interesting:
                  print('  ' + item)
          else:
              print('  (no wrapped AppState.shared properties found)')

          # Regression guard for the V6 compiler failure. The singleton conversion must
          # never consume a child value merely because its initializer begins with
          # `SettingsStore.shared`.
          appearance_path = root / 'Views' / 'Settings' / 'AppearanceSettingsView.swift'
          if appearance_path.exists():
              for n, line in enumerate(appearance_path.read_text().splitlines(), 1):
                  if 'dynamicAppearancePreferences' in line:
                      print(f'Appearance preference wiring: {appearance_path}:{n}: {line.strip()}')
                      if ('@ObservedObject' in line or '@StateObject' in line) and 'SettingsStore.shared.dynamicAppearancePreferences' in line:
                          problems.append(
                              f'{appearance_path}:{n}: V6 regression: child value '
                              'SettingsStore.shared.dynamicAppearancePreferences was wrapped as ObservableObject'
                          )

          if problems:
              print('\nERROR: Observation backport verification failed:')
              for p in problems:
                  print('  ' + p)
              raise SystemExit(1)
          print('iOS 16 Observation wiring verification passed.')
          PY

      - name: Add iOS 16 SwiftUI compatibility helpers
        shell: bash
        run: |
          cat > platforms/ios/app/src/main/swift/Views/IOS16Compatibility.swift <<'SWIFT'
          import SwiftUI

          // Backport of the two-value iOS 17 onChange closure using iOS 16's one-value API.
          private struct IOS16TwoValueOnChangeModifier<Value: Equatable>: ViewModifier {
              let value: Value
              let action: (Value, Value) -> Void
              @State private var previous: Value?

              func body(content: Content) -> some View {
                  content
                      .onAppear { previous = value }
                      .onChange(of: value) { newValue in
                          let oldValue = previous ?? newValue
                          previous = newValue
                          action(oldValue, newValue)
                      }
              }
          }

          extension View {
              func ios16OnChange<Value: Equatable>(of value: Value, _ action: @escaping (Value, Value) -> Void) -> some View {
                  modifier(IOS16TwoValueOnChangeModifier(value: value, action: action))
              }

              func ios16OnChange<Value: Equatable>(of value: Value, _ action: @escaping (Value) -> Void) -> some View {
                  onChange(of: value, perform: action)
              }
          }

          // iOS 17 ContentUnavailableView replacement used by ARMSX2 on iOS 16.
          // The upstream convenience initializer accepts a StringProtocol title and an
          // optional Text description. Keep that call shape so dynamic localized Strings
          // (SettingsStore.localized(...)) compile on iOS 16 as well.
          struct IOS16ContentUnavailableView: View {
              let title: String
              let systemImage: String
              let description: Text?

              init<S: StringProtocol>(_ title: S, systemImage: String, description: Text? = nil) {
                  self.title = String(title)
                  self.systemImage = systemImage
                  self.description = description
              }

              var body: some View {
                  VStack(spacing: 12) {
                      Image(systemName: systemImage)
                          .font(.system(size: 34, weight: .semibold))
                      Text(title)
                          .font(.headline)
                      if let description {
                          description
                              .font(.subheadline)
                              .multilineTextAlignment(.center)
                      }
                  }
                  .padding()
              }
          }
          SWIFT

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('platforms/ios/app/src/main/swift')

          def strip_member_call(text: str, member: str) -> tuple[str, int]:
              needle = '.' + member + '('
              out = []
              i = 0
              removed = 0
              while True:
                  p = text.find(needle, i)
                  if p < 0:
                      out.append(text[i:])
                      break
                  out.append(text[i:p])
                  q = p + len(needle)
                  depth = 1
                  in_string = False
                  escaped = False
                  while q < len(text) and depth:
                      ch = text[q]
                      if in_string:
                          if escaped:
                              escaped = False
                          elif ch == '\\':
                              escaped = True
                          elif ch == '"':
                              in_string = False
                      else:
                          if ch == '"':
                              in_string = True
                          elif ch == '(':
                              depth += 1
                          elif ch == ')':
                              depth -= 1
                      q += 1
                  if depth != 0:
                      # Do not corrupt source on an unmatched call.
                      out.append(text[p:])
                      break
                  i = q
                  removed += 1
              return ''.join(out), removed

          counts = {}
          for path in root.rglob('*.swift'):
              if path.name == 'IOS16Compatibility.swift':
                  continue
              text = path.read_text()

              # iOS 17 two-value onChange -> compatibility modifier. Existing one-value uses also work.
              c = text.count('.onChange(of:')
              if c:
                  text = text.replace('.onChange(of:', '.ios16OnChange(of:')
                  counts['onChange'] = counts.get('onChange', 0) + c

              # ShapeStyle shorthand resolves to iOS 17 overloads in Xcode 26 when targeting 16.
              repls = {
                  '.fill(.black': '.fill(Color.black',
                  '.fill(.white': '.fill(Color.white',
                  '.stroke(.black': '.stroke(Color.black',
                  '.stroke(.white': '.stroke(Color.white',
              }
              for a, b in repls.items():
                  n = text.count(a)
                  if n:
                      text = text.replace(a, b)
                      counts[a] = counts.get(a, 0) + n

              # These modifiers are cosmetic and unavailable on iOS 16.0. Removing them preserves core behavior.
              for member in ('contentMargins', 'scrollBounceBehavior', 'symbolEffect', 'contentTransition', 'presentationBackground', 'presentationCornerRadius'):
                  text, n = strip_member_call(text, member)
                  if n:
                      counts[member] = counts.get(member, 0) + n

              # Local replacement for the iOS 17 empty-state view.
              n = text.count('ContentUnavailableView(')
              if n:
                  text = text.replace('ContentUnavailableView(', 'IOS16ContentUnavailableView(')
                  counts['ContentUnavailableView'] = counts.get('ContentUnavailableView', 0) + n

              # MagnifyGesture is iOS 17. MagnificationGesture exists on iOS 16.
              if 'MagnifyGesture()' in text:
                  n = text.count('MagnifyGesture()')
                  text = text.replace('MagnifyGesture()', 'MagnificationGesture()')
                  # ARMSX2's layout editor reads MagnifyGesture.Value.magnification. The older
                  # MagnificationGesture value is already the CGFloat scale itself.
                  text = re.sub(r'\b([A-Za-z_][A-Za-z0-9_]*)\.magnification\b', r'\1', text)
                  counts['MagnifyGesture'] = counts.get('MagnifyGesture', 0) + n

              # iOS 17 allows chaining Shape.fill(...).stroke(...). On iOS 16 the
              # filled result is a View, so the following .stroke resolves to the newer
              # View API and fails availability checking. Preserve the visual by putting
              # the stroke in an overlay of the same shape.
              lines = text.splitlines()
              fixed_lines = []
              i = 0
              shape_chain_fixes = 0
              while i < len(lines):
                  if i + 2 < len(lines):
                      base = lines[i].strip()
                      fill = lines[i + 1].lstrip()
                      stroke = lines[i + 2].lstrip()
                      simple_shape = bool(re.match(r'^[A-Za-z_][A-Za-z0-9_\.]*\(.*\)$', base))
                      simple_name = bool(re.match(r'^[A-Za-z_][A-Za-z0-9_]*$', base))
                      if (simple_shape or simple_name) and fill.startswith('.fill(') and stroke.startswith('.stroke('):
                          fill_indent = lines[i + 1][:len(lines[i + 1]) - len(lines[i + 1].lstrip())]
                          fixed_lines.append(lines[i])
                          fixed_lines.append(lines[i + 1])
                          fixed_lines.append(fill_indent + '.overlay(')
                          fixed_lines.append(fill_indent + '    ' + base + stroke)
                          fixed_lines.append(fill_indent + ')')
                          i += 3
                          shape_chain_fixes += 1
                          continue
                  fixed_lines.append(lines[i])
                  i += 1
              if shape_chain_fixes:
                  text = '\n'.join(fixed_lines) + ('\n' if text.endswith('\n') else '')
                  counts['fill+stroke overlays'] = counts.get('fill+stroke overlays', 0) + shape_chain_fixes

              path.write_text(text)

          print('SwiftUI compatibility rewrites:')
          for k, v in sorted(counts.items()):
              print(f'  {k}: {v}')
          PY


      - name: Resolve FFmpeg headers for updated PCSX2 core
        shell: bash
        run: |
          set -euo pipefail

          # Current ARMSX2/PCSX2 GSCapture.cpp includes FFmpeg API headers even
          # when USE_LINKED_FFMPEG is disabled.  The iOS build does not need
          # FFmpeg at runtime for normal emulation, but the compiler still needs
          # a complete API header tree.
          #
          # Do NOT use Homebrew headers/libraries here:
          # - runner images can expose an incomplete/unexpected keg layout;
          # - Homebrew libraries are macOS binaries and must never be linked
          #   into an iPhoneOS target.
          #
          # Instead use a pinned upstream FFmpeg source tree as HEADER-ONLY input.
          FFMPEG_TAG="n7.1.5"
          FFMPEG_ARCHIVE="/tmp/ffmpeg-${FFMPEG_TAG}.tar.gz"
          FFMPEG_WORK="/tmp/armsx2-ffmpeg-src"

          rm -rf "$FFMPEG_WORK" "$FFMPEG_ARCHIVE"
          mkdir -p "$FFMPEG_WORK"

          echo "Downloading pinned FFmpeg source headers: ${FFMPEG_TAG}"
          curl -fL --retry 5 --retry-delay 2 \
            "https://codeload.github.com/FFmpeg/FFmpeg/tar.gz/refs/tags/${FFMPEG_TAG}" \
            -o "$FFMPEG_ARCHIVE"

          tar -xzf "$FFMPEG_ARCHIVE" -C "$FFMPEG_WORK" --strip-components=1

          FFMPEG_INCLUDE_ROOT="$FFMPEG_WORK"

          # FFmpeg's public headers include libavutil/avconfig.h, but that file
          # is generated by FFmpeg's configure script and is therefore absent
          # from a pristine source archive.  For Apple arm64/iOS the public
          # header configuration is little-endian with fast unaligned access.
          # This mirrors the generated iOS/arm64 FFmpeg public-header config.
          cat > "$FFMPEG_INCLUDE_ROOT/libavutil/avconfig.h" <<'AVCONFIG'
          /* Generated for ARMSX2 iOS 16 header-only FFmpeg compatibility. */
          #ifndef AVUTIL_AVCONFIG_H
          #define AVUTIL_AVCONFIG_H
          #define AV_HAVE_BIGENDIAN 0
          #define AV_HAVE_FAST_UNALIGNED 1
          #endif /* AVUTIL_AVCONFIG_H */
          AVCONFIG

          echo "Resolved FFmpeg header root: $FFMPEG_INCLUDE_ROOT"
          for h in \
            libavcodec/avcodec.h \
            libavcodec/version.h \
            libavformat/avformat.h \
            libavformat/version.h \
            libavutil/avutil.h \
            libavutil/version.h \
            libavutil/avconfig.h \
            libswresample/swresample.h \
            libswresample/version.h \
            libswscale/swscale.h \
            libswscale/version.h
          do
            test -f "$FFMPEG_INCLUDE_ROOT/$h" || {
              echo "ERROR: Pinned FFmpeg source tree is missing required header: $FFMPEG_INCLUDE_ROOT/$h" >&2
              exit 1
            }
            echo "  OK $FFMPEG_INCLUDE_ROOT/$h"
          done

          echo
          echo "Generated FFmpeg public avconfig.h:"
          cat "$FFMPEG_INCLUDE_ROOT/libavutil/avconfig.h"
          grep -q '^#define AV_HAVE_BIGENDIAN 0$' "$FFMPEG_INCLUDE_ROOT/libavutil/avconfig.h"
          grep -q '^#define AV_HAVE_FAST_UNALIGNED 1$' "$FFMPEG_INCLUDE_ROOT/libavutil/avconfig.h"

          echo "FFMPEG_INCLUDE_ROOT=$FFMPEG_INCLUDE_ROOT" >> "$GITHUB_ENV"

      - name: Patch FFmpeg header include path into iOS PCSX2 build
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os

          cmake = Path('platforms/ios/app/src/main/cpp/CMakeLists.txt')
          include_root = Path(os.environ['FFMPEG_INCLUDE_ROOT']).resolve()

          required = [
              include_root / 'libavcodec/avcodec.h',
              include_root / 'libavformat/avformat.h',
              include_root / 'libavutil/avutil.h',
              include_root / 'libswresample/swresample.h',
              include_root / 'libswscale/swscale.h',
          ]
          missing = [str(p) for p in required if not p.is_file()]
          if missing:
              raise SystemExit('Resolved FFmpeg header root is incomplete:\\n  ' + '\\n  '.join(missing))

          text = cmake.read_text()
          marker = 'add_subdirectory(${ARMSX2_ROOT}/pcsx2 ${CMAKE_BINARY_DIR}/pcsx2)'
          tag = '# ARMSX2_IOS16_FFMPEG_HEADERS_V82'

          if tag not in text:
              if marker not in text:
                  raise SystemExit(
                      'Could not find the PCSX2 add_subdirectory marker in the iOS CMakeLists.txt; '
                      'upstream changed build wiring and this compatibility patch must be reviewed.'
                  )

              inc = include_root.as_posix()
              replacement = '\n'.join([
                  tag,
                  '# Updated PCSX2 GSCapture.cpp includes FFmpeg headers unconditionally.',
                  '# Supply a pinned FFmpeg SOURCE TREE as compile-only headers for iOS.',
                  '# Do not set USE_LINKED_FFMPEG: no host/macOS FFmpeg library may enter the IPA.',
                  f'set(FFMPEG_INCLUDE_DIRS "{inc}")',
                  f'include_directories(BEFORE "{inc}")',
                  '',
                  marker,
                  '',
                  'if(TARGET PCSX2_FLAGS)',
                  f'    target_include_directories(PCSX2_FLAGS INTERFACE "{inc}")',
                  'endif()',
                  '',
              ])
              text = text.replace(marker, replacement, 1)
              cmake.write_text(text)

          patched = cmake.read_text()
          if tag not in patched:
              raise SystemExit('FFmpeg iOS 16 compatibility marker was not written.')
          if include_root.as_posix() not in patched:
              raise SystemExit('Resolved FFmpeg header path was not wired into the iOS CMake build.')

          # Guard against accidentally linking runner-host FFmpeg.
          added_region = patched[patched.index(tag):patched.index(tag) + 1400]
          if re_search := __import__('re').search(r'\bset\s*\(\s*USE_LINKED_FFMPEG\b|\btarget_link_libraries\b[^\n]*FFMPEG::', added_region):
              raise SystemExit(f'Internal guard: V8.2 must remain header-only; found linked FFmpeg wiring: {re_search.group(0)}')

          print(f'Injected pinned header-only FFmpeg include path: {include_root}')
          PY

      - name: Verify FFmpeg header-only compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          echo "FFmpeg header root: $FFMPEG_INCLUDE_ROOT"
          ls -l "$FFMPEG_INCLUDE_ROOT/libavcodec/avcodec.h"
          echo
          echo 'iOS CMake FFmpeg wiring:'
          grep -n -A20 -B3 'ARMSX2_IOS16_FFMPEG_HEADERS_V82' platforms/ios/app/src/main/cpp/CMakeLists.txt
          echo
          echo 'Checking that the compatibility patch did not enable linked FFmpeg...'
          if grep -nE 'set[[:space:]]*\([[:space:]]*USE_LINKED_FFMPEG|target_link_libraries.*FFMPEG::' \
              platforms/ios/app/src/main/cpp/CMakeLists.txt; then
            echo 'ERROR: iOS compatibility patch must not enable linked FFmpeg.' >&2
            exit 1
          fi
          echo 'Header-only FFmpeg compatibility wiring passed.'

      - name: Add GT4 analog trigger pedals
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          swift_path = Path('platforms/ios/app/src/main/swift/Views/Settings/GamepadSettingsView.swift')
          scene_path = Path('platforms/ios/app/src/main/cpp/IOS/SceneDelegate.mm')
          sdl_path = Path('pcsx2/Input/SDLInputSource.cpp')

          for path in (swift_path, scene_path, sdl_path):
              if not path.is_file():
                  raise SystemExit(f'GT4 trigger-pedal patch: expected source file is missing: {path}')

          # 1) SwiftUI setting.
          swift_tag = '// ARMSX2_IOS16_GT4_TRIGGER_PEDALS'
          swift = swift_path.read_text()

          if swift_tag not in swift:
              if 'import SwiftUI' not in swift:
                  raise SystemExit('GT4 trigger-pedal patch: GamepadSettingsView.swift no longer imports SwiftUI.')
              if 'import Darwin' not in swift:
                  swift = swift.replace('import SwiftUI', 'import SwiftUI\nimport Darwin', 1)

              struct_anchor = 'struct GamepadSettingsView: View {'
              if struct_anchor not in swift:
                  raise SystemExit('GT4 trigger-pedal patch: GamepadSettingsView declaration changed upstream.')

              helper = '''// ARMSX2_IOS16_GT4_TRIGGER_PEDALS
          private func armsx2SetGT4TriggerPedalsEnvironment(_ enabled: Bool) {
              let value = enabled ? "1" : "0"
              "ARMSX2_GT4_TRIGGER_PEDALS".withCString { key in
                  value.withCString { rawValue in
                      _ = setenv(key, rawValue, 1)
                  }
              }
          }

          '''
              swift = swift.replace(struct_anchor, helper + struct_anchor, 1)

              settings_pat = re.compile(
                  r'(struct\s+GamepadSettingsView\s*:\s*View\s*\{\s*\n'
                  r'(?:[ \t]*\n)*'
                  r'[ \t]*@(?:State|ObservedObject)\s+private\s+var\s+settings\s*=\s*SettingsStore\.shared[^\n]*\n)'
              )
              match = settings_pat.search(swift)
              if not match:
                  raise SystemExit(
                      'GT4 trigger-pedal patch: could not locate SettingsStore.shared after the iOS 16 Observation backport.'
                  )

              storage = (
                  '\n    @AppStorage("ARMSX2_GT4TriggerPedals") '
                  'private var gt4TriggerPedals = false\n'
              )
              swift = swift[:match.end()] + storage + swift[match.end():]

              rumble_pos = swift.find('ARMSX2Bridge.testControllerRumble()')
              if rumble_pos < 0:
                  raise SystemExit('GT4 trigger-pedal patch: Tools/rumble section changed upstream.')
              tools_section_pos = swift.rfind('Section {', 0, rumble_pos)
              if tools_section_pos < 0:
                  raise SystemExit('GT4 trigger-pedal patch: could not locate Tools section.')

              gt4_section = '''Section {
                      Toggle(isOn: Binding(
                          get: { gt4TriggerPedals },
                          set: { enabled in
                              gt4TriggerPedals = enabled
                              armsx2SetGT4TriggerPedalsEnvironment(enabled)
                          }
                      )) {
                          Label {
                              VStack(alignment: .leading, spacing: 3) {
                                  Text(settings.localized("Analog Trigger Pedals"))
                                  Text(settings.localized("R2 = Throttle · L2 = Brake"))
                                      .font(.caption)
                                      .foregroundColor(.secondary)
                              }
                          } icon: {
                              Image(systemName: "gauge")
                          }
                      }
                  } header: {
                      Text(settings.localized("Gran Turismo 4"))
                  } footer: {
                      Text(settings.localized("Uses the full analog trigger travel: R2 drives PS2 right-stick up (throttle) and L2 drives PS2 right-stick down (brake). While enabled, L2/R2 are consumed as pedal inputs instead of normal PS2 L2/R2 buttons. The physical right stick works normally when neither trigger is pressed."))
                  }

                  '''
              swift = swift[:tools_section_pos] + gt4_section + swift[tools_section_pos:]
              swift_path.write_text(swift)

          # 2) Persist setting across cold launches.
          scene_tag = '// ARMSX2_IOS16_GT4_TRIGGER_PEDALS_BOOT'
          scene = scene_path.read_text()
          if scene_tag not in scene:
              if '#include <stdlib.h>' not in scene:
                  ui_import = '#import <UIKit/UIKit.h>'
                  if ui_import not in scene:
                      raise SystemExit('GT4 trigger-pedal patch: SceneDelegate UIKit import changed upstream.')
                  scene = scene.replace(ui_import, '#include <stdlib.h>\n\n' + ui_import, 1)

              sdl_init_anchor = '// --- SDL Initialization ---'
              pos = scene.find(sdl_init_anchor)
              if pos < 0:
                  raise SystemExit('GT4 trigger-pedal patch: SceneDelegate SDL initialization marker changed upstream.')

              boot_code = '''// ARMSX2_IOS16_GT4_TRIGGER_PEDALS_BOOT
          const BOOL gt4TriggerPedalsEnabled =
              [[NSUserDefaults standardUserDefaults] boolForKey:@"ARMSX2_GT4TriggerPedals"];
          setenv("ARMSX2_GT4_TRIGGER_PEDALS", gt4TriggerPedalsEnabled ? "1" : "0", 1);
          NSLog(@"[Gamepad] GT4 analog trigger pedals: %@",
                gt4TriggerPedalsEnabled ? @"ON" : @"OFF");

          '''
              scene = scene[:pos] + boot_code + scene[pos:]
              scene_path.write_text(scene)

          # 3) GT4 analog trigger pedals V9.2.
          #
          # V9.1 proved direct Pad::SetControllerState() reaches GT4, but field
          # testing showed only a millisecond-scale pulse on press/release.
          # That means the direct PS2 state was being overwritten by the normal
          # input path after the edge event.
          #
          # V9.2 keeps the direct PS2 injection, but ALSO re-reads L2/R2 and
          # re-applies the synthetic right-stick Y at the end of every SDL
          # PollEvents() cycle while a trigger is held.
          input_tag = '// ARMSX2_IOS16_GT4_TRIGGER_PEDALS_HELD_POLL_V92'
          sdl = sdl_path.read_text()
          if input_tag not in sdl:
              if '#include "SIO/Pad/Pad.h"' not in sdl:
                  include_anchor = '#include "Input/InputManager.h"'
                  if include_anchor not in sdl:
                      raise SystemExit(
                          'GT4 V9.2 patch: SDLInputSource input includes changed upstream.'
                      )
                  sdl = sdl.replace(
                      include_anchor,
                      include_anchor + '\n#include "SIO/Pad/Pad.h"',
                      1,
                  )

              if '#include <cstdlib>' not in sdl:
                  include_anchor = '#include <cmath>'
                  if include_anchor not in sdl:
                      raise SystemExit(
                          'GT4 V9.2 patch: SDLInputSource standard includes changed upstream.'
                      )
                  sdl = sdl.replace(include_anchor, include_anchor + '\n#include <cstdlib>', 1)

              # Forward declarations must appear before PollEvents(), because
              # the helper definitions remain near NormalizeS16 later in file.
              poll_anchor = 'void SDLInputSource::PollEvents()'
              poll_pos = sdl.find(poll_anchor)
              if poll_pos < 0:
                  raise SystemExit('GT4 V9.2 patch: SDLInputSource::PollEvents changed upstream.')

              forward_decl = '''// ARMSX2_IOS16_GT4_TRIGGER_PEDALS_HELD_POLL_V92
          static bool ARMSX2GT4TriggerPedalsEnabled();
          static bool ARMSX2GT4SetPS2RightStickY(u32 pad_index, float right_y);

          '''
              sdl = sdl[:poll_pos] + forward_decl + sdl[poll_pos:]

              # Replace the stock PollEvents body with the same event draining
              # plus a held-state reassertion at the END of every poll.
              poll_re = re.compile(
                  r'void SDLInputSource::PollEvents\(\)\s*\{\s*'
                  r'for \(\;\;\)\s*\{\s*'
                  r'SDL_Event ev;\s*'
                  r'if \(SDL_PollEvent\(&ev\)\)\s*'
                  r'ProcessSDLEvent\(&ev\);\s*'
                  r'else\s*'
                  r'break;\s*'
                  r'\}\s*'
                  r'\}',
                  re.S,
              )
              poll_match = poll_re.search(sdl)
              if not poll_match:
                  raise SystemExit(
                      'GT4 V9.2 patch: stock PollEvents body no longer matches expected upstream shape.'
                  )

              poll_body = '''void SDLInputSource::PollEvents()
          {
              for (;;)
              {
                  SDL_Event ev;
                  if (SDL_PollEvent(&ev))
                      ProcessSDLEvent(&ev);
                  else
                      break;
              }

              // GT4 V9.2: event-edge writes are not enough on iOS. Reassert
              // the pedal-derived PS2 RightY after ALL SDL events each poll.
              if (!ARMSX2GT4TriggerPedalsEnabled())
                  return;

              for (const ControllerData& cd : m_controllers)
              {
                  if (!cd.gamepad || cd.player_id < 0 ||
                      cd.player_id >= static_cast<int>(Pad::NUM_CONTROLLER_PORTS))
                  {
                      continue;
                  }

                  s16 left_trigger =
                      SDL_GetGamepadAxis(cd.gamepad, SDL_GAMEPAD_AXIS_LEFT_TRIGGER);
                  s16 right_trigger =
                      SDL_GetGamepadAxis(cd.gamepad, SDL_GAMEPAD_AXIS_RIGHT_TRIGGER);

                  if (left_trigger < 0)
                      left_trigger = 0;
                  if (right_trigger < 0)
                      right_trigger = 0;

                  // No held pedal: leave ordinary RightY entirely to stock
                  // PCSX2 input handling. Final release is restored by the
                  // trigger edge handler below.
                  if (left_trigger == 0 && right_trigger == 0)
                      continue;

                  const float pedal_right_y =
                      static_cast<float>(
                          static_cast<int>(left_trigger) -
                          static_cast<int>(right_trigger)) /
                      32767.0f;

                  ARMSX2GT4SetPS2RightStickY(
                      static_cast<u32>(cd.player_id), pedal_right_y);
              }
          }'''
              sdl = sdl[:poll_match.start()] + poll_body + sdl[poll_match.end():]

              normalize_anchor = 'static float NormalizeS16(s16 value)'
              normalize_pos = sdl.find(normalize_anchor)
              if normalize_pos < 0:
                  raise SystemExit('GT4 V9.2 patch: NormalizeS16 changed upstream.')

              helper = '''static bool ARMSX2GT4TriggerPedalsEnabled()
          {
              const char* value = std::getenv("ARMSX2_GT4_TRIGGER_PEDALS");
              return value && value[0] == '1';
          }

          static bool ARMSX2GT4SetPS2RightStickY(u32 pad_index, float right_y)
          {
              if (pad_index >= Pad::NUM_CONTROLLER_PORTS)
                  return false;

              const Pad::ControllerInfo* info =
                  Pad::GetControllerInfo(EmuConfig.Pad.Ports[pad_index].Type);
              if (!info)
                  return false;

              bool found_up = false;
              bool found_down = false;
              u32 up_bind = 0;
              u32 down_bind = 0;

              for (const InputBindingInfo& bi : info->bindings)
              {
                  if (bi.generic_mapping == GenericInputBinding::RightStickUp)
                  {
                      up_bind = bi.bind_index;
                      found_up = true;
                  }
                  else if (bi.generic_mapping == GenericInputBinding::RightStickDown)
                  {
                      down_bind = bi.bind_index;
                      found_down = true;
                  }
              }

              if (!found_up || !found_down)
                  return false;

              if (right_y < -1.0f)
                  right_y = -1.0f;
              else if (right_y > 1.0f)
                  right_y = 1.0f;

              const float up_value = (right_y < 0.0f) ? -right_y : 0.0f;
              const float down_value = (right_y > 0.0f) ? right_y : 0.0f;

              Pad::SetControllerState(pad_index, up_bind, up_value);
              Pad::SetControllerState(pad_index, down_bind, down_value);
              return true;
          }

          '''
              sdl = sdl[:normalize_pos] + helper + sdl[normalize_pos:]

              function_anchor = 'bool SDLInputSource::HandleGamepadAxisEvent(const SDL_GamepadAxisEvent* ev)'
              function_pos = sdl.find(function_anchor)
              if function_pos < 0:
                  raise SystemExit(
                      'GT4 V9.2 patch: HandleGamepadAxisEvent changed upstream.'
                  )

              key_match = re.search(r'\n[ \t]*const InputBindingKey key\(', sdl[function_pos:])
              if not key_match:
                  raise SystemExit(
                      'GT4 V9.2 patch: normal gamepad-axis dispatch point changed upstream.'
                  )
              key_pos = function_pos + key_match.start() + 1

              pedal_block = '''\t// GT4 V9.2: consume physical L2/R2 as pedal axes and update the
          \t// emulated PS2 RightY immediately on edge events. PollEvents()
          \t// reasserts the held value every poll so this state cannot collapse
          \t// into a millisecond pulse.
          \tif (ARMSX2GT4TriggerPedalsEnabled() && it->gamepad &&
          \t\tit->player_id >= 0 &&
          \t\tit->player_id < static_cast<int>(Pad::NUM_CONTROLLER_PORTS))
          \t{
          \t\tconst bool is_left_trigger = (ev->axis == SDL_GAMEPAD_AXIS_LEFT_TRIGGER);
          \t\tconst bool is_right_trigger = (ev->axis == SDL_GAMEPAD_AXIS_RIGHT_TRIGGER);
          \t\tconst bool is_trigger = is_left_trigger || is_right_trigger;
          \t\tconst bool is_right_y = (ev->axis == SDL_GAMEPAD_AXIS_RIGHTY);

          \t\tif (is_trigger || is_right_y)
          \t\t{
          \t\t\ts16 left_trigger =
          \t\t\t\tSDL_GetGamepadAxis(it->gamepad, SDL_GAMEPAD_AXIS_LEFT_TRIGGER);
          \t\t\ts16 right_trigger =
          \t\t\t\tSDL_GetGamepadAxis(it->gamepad, SDL_GAMEPAD_AXIS_RIGHT_TRIGGER);

          \t\t\t// Use the changing trigger's event value immediately, then the
          \t\t\t// end-of-poll path takes over using fresh queried state.
          \t\t\tif (is_left_trigger)
          \t\t\t\tleft_trigger = ev->value;
          \t\t\telse if (is_right_trigger)
          \t\t\t\tright_trigger = ev->value;

          \t\t\tif (left_trigger < 0)
          \t\t\t\tleft_trigger = 0;
          \t\t\tif (right_trigger < 0)
          \t\t\t\tright_trigger = 0;

          \t\t\tconst bool pedals_active =
          \t\t\t\t(left_trigger > 0 || right_trigger > 0);
          \t\t\tconst u32 pad_index = static_cast<u32>(it->player_id);

          \t\t\tif (pedals_active)
          \t\t\t{
          \t\t\t\tconst float pedal_right_y =
          \t\t\t\t\tstatic_cast<float>(
          \t\t\t\t\t\tstatic_cast<int>(left_trigger) -
          \t\t\t\t\t\tstatic_cast<int>(right_trigger)) /
          \t\t\t\t\t32767.0f;

          \t\t\t\tARMSX2GT4SetPS2RightStickY(pad_index, pedal_right_y);
          \t\t\t\treturn true;
          \t\t\t}

          \t\t\tif (is_trigger)
          \t\t\t{
          \t\t\t\t// Final release: hand RightY back immediately to the current
          \t\t\t\t// physical right-stick value instead of leaving stale pedal Y.
          \t\t\t\tconst float physical_right_y =
          \t\t\t\t\tNormalizeS16(
          \t\t\t\t\t\tSDL_GetGamepadAxis(it->gamepad, SDL_GAMEPAD_AXIS_RIGHTY));
          \t\t\t\tARMSX2GT4SetPS2RightStickY(pad_index, physical_right_y);
          \t\t\t\treturn true;
          \t\t\t}

          \t\t\t// While any pedal is held, physical RightY is intentionally
          \t\t\t// suppressed. With no pedal active, ordinary RightY falls
          \t\t\t// through to stock PCSX2 handling.
          \t\t}
          \t}

          '''
              sdl = sdl[:key_pos] + pedal_block + sdl[key_pos:]
              sdl_path.write_text(sdl)

          print('GT4 analog trigger-pedal feature patched successfully.')
          print(f'  Swift UI: {swift_path}')
          print(f'  Cold-launch persistence: {scene_path}')
          print(f'  SDL held-trigger polling + direct PS2 injection: {sdl_path}')
          PY

      - name: Add analog tuning V9.3.1 UI hotfix
        shell: bash
        run: |
