                      }
                  } header: {
                      Text("Analog Tuning")
                  } footer: {
                      Text("Defaults are 0% deadzone and 100% full threshold. Those defaults preserve stock left-stick steering and the field-proven V9.2 GT4 trigger response.")
                  }

                  '''
              swift = (
                  swift[:tools_section_pos] +
                  tuning_section +
                  swift[tools_section_pos:]
              )
              swift_path.write_text(swift)

          # ==============================================================
          # SceneDelegate: restore tuning values on cold launch.
          # ==============================================================
          scene_tag = '// ARMSX2_IOS16_ANALOG_TUNING_BOOT_V931'
          scene = scene_path.read_text()

          if scene_tag not in scene:
              if '#include <stdio.h>' not in scene:
                  if '#include <stdlib.h>' in scene:
                      scene = scene.replace(
                          '#include <stdlib.h>',
                          '#include <stdlib.h>\\n#include <stdio.h>',
                          1
                      )
                  else:
                      raise SystemExit(
                          'Analog tuning V9.3.1: expected V9.2 stdlib include is missing.'
                      )

              init_anchor = '// --- SDL Initialization ---'
              init_pos = scene.find(init_anchor)
              if init_pos < 0:
                  raise SystemExit(
                      'Analog tuning V9.3.1: SceneDelegate SDL initialization marker changed upstream.'
                  )

              tuning_boot = '''// ARMSX2_IOS16_ANALOG_TUNING_BOOT_V931
          NSUserDefaults *armsx2TuningDefaults = [NSUserDefaults standardUserDefaults];

          const double armsx2LeftSteeringDeadzone =
              [armsx2TuningDefaults objectForKey:@"ARMSX2_LeftSteeringDeadzone"] ?
                  [armsx2TuningDefaults doubleForKey:@"ARMSX2_LeftSteeringDeadzone"] : 0.0;
          const double armsx2LeftSteeringFullThreshold =
              [armsx2TuningDefaults objectForKey:@"ARMSX2_LeftSteeringFullThreshold"] ?
                  [armsx2TuningDefaults doubleForKey:@"ARMSX2_LeftSteeringFullThreshold"] : 1.0;
          const double armsx2GT4TriggerDeadzone =
              [armsx2TuningDefaults objectForKey:@"ARMSX2_GT4TriggerDeadzone"] ?
                  [armsx2TuningDefaults doubleForKey:@"ARMSX2_GT4TriggerDeadzone"] : 0.0;
          const double armsx2GT4TriggerFullThreshold =
              [armsx2TuningDefaults objectForKey:@"ARMSX2_GT4TriggerFullThreshold"] ?
                  [armsx2TuningDefaults doubleForKey:@"ARMSX2_GT4TriggerFullThreshold"] : 1.0;

          char armsx2TuningBuffer[32];

          snprintf(
              armsx2TuningBuffer, sizeof(armsx2TuningBuffer), "%.6f",
              armsx2LeftSteeringDeadzone);
          setenv("ARMSX2_LEFT_STEERING_DEADZONE", armsx2TuningBuffer, 1);

          snprintf(
              armsx2TuningBuffer, sizeof(armsx2TuningBuffer), "%.6f",
              armsx2LeftSteeringFullThreshold);
          setenv("ARMSX2_LEFT_STEERING_FULL_THRESHOLD", armsx2TuningBuffer, 1);

          snprintf(
              armsx2TuningBuffer, sizeof(armsx2TuningBuffer), "%.6f",
              armsx2GT4TriggerDeadzone);
          setenv("ARMSX2_GT4_TRIGGER_DEADZONE", armsx2TuningBuffer, 1);

          snprintf(
              armsx2TuningBuffer, sizeof(armsx2TuningBuffer), "%.6f",
              armsx2GT4TriggerFullThreshold);
          setenv("ARMSX2_GT4_TRIGGER_FULL_THRESHOLD", armsx2TuningBuffer, 1);

          '''
              scene = scene[:init_pos] + tuning_boot + scene[init_pos:]
              scene_path.write_text(scene)

          # ==============================================================
          # Native input tuning.
          # IMPORTANT: V9.2 held-trigger / direct-pad code remains intact.
          # ==============================================================
          cpp_tag = '// ARMSX2_IOS16_ANALOG_TUNING_NATIVE_V931'
          sdl = sdl_path.read_text()

          if cpp_tag not in sdl:
              v92_tag = '// ARMSX2_IOS16_GT4_TRIGGER_PEDALS_HELD_POLL_V92'
              v92_pos = sdl.find(v92_tag)
              if v92_pos < 0:
                  raise SystemExit(
                      'Analog tuning V9.3.1: golden V9.2 held-poll marker is missing.'
                  )

              helpers = '''// ARMSX2_IOS16_ANALOG_TUNING_NATIVE_V931
          static float ARMSX2AnalogTuningEnv(const char* key, float fallback)
          {
              const char* value = std::getenv(key);
              if (!value || !value[0])
                  return fallback;

              char* end = nullptr;
              const float parsed = std::strtof(value, &end);
              return (end && end != value) ? parsed : fallback;
          }

          static float ARMSX2ApplyDeadzoneThreshold(
              float value, float deadzone, float full_threshold)
          {
              if (deadzone < 0.0f)
                  deadzone = 0.0f;
              else if (deadzone > 0.49f)
                  deadzone = 0.49f;

              if (full_threshold < 0.50f)
                  full_threshold = 0.50f;
              else if (full_threshold > 1.0f)
                  full_threshold = 1.0f;

              if (full_threshold <= deadzone + 0.01f)
                  full_threshold = deadzone + 0.01f;

              const float sign = (value < 0.0f) ? -1.0f : 1.0f;
              const float magnitude = (value < 0.0f) ? -value : value;

              if (magnitude <= deadzone)
                  return 0.0f;
              if (magnitude >= full_threshold)
                  return sign;

              return sign * (
                  (magnitude - deadzone) /
                  (full_threshold - deadzone));
          }

          static float ARMSX2TuneGT4Trigger(s16 raw_value)
          {
              if (raw_value <= 0)
                  return 0.0f;

              const float raw =
                  static_cast<float>(raw_value) / 32767.0f;
              const float deadzone = ARMSX2AnalogTuningEnv(
                  "ARMSX2_GT4_TRIGGER_DEADZONE", 0.0f);
              const float full_threshold = ARMSX2AnalogTuningEnv(
                  "ARMSX2_GT4_TRIGGER_FULL_THRESHOLD", 1.0f);

              const float tuned = ARMSX2ApplyDeadzoneThreshold(
                  raw, deadzone, full_threshold);
              return (tuned > 0.0f) ? tuned : 0.0f;
          }

          '''
              sdl = sdl[:v92_pos] + helpers + sdl[v92_pos:]

              # V9.2 has exactly two signed pedal math sites:
              # held polling + immediate trigger-edge handling.
              pedal_math = re.compile(
                  r'const float pedal_right_y\s*=\s*'
                  r'static_cast<float>\(\s*'
                  r'static_cast<int>\(left_trigger\)\s*-\s*'
                  r'static_cast<int>\(right_trigger\)\s*'
                  r'\)\s*/\s*32767\.0f\s*;',
                  re.S,
              )
              matches = list(pedal_math.finditer(sdl))
              if len(matches) != 2:
                  raise SystemExit(
                      'Analog tuning V9.3.1: expected exactly two V9.2 pedal math '
                      f'sites, found {len(matches)}.'
                  )

              tuned_pedal_math = '''const float left_pedal =
                      ARMSX2TuneGT4Trigger(left_trigger);
                  const float right_pedal =
                      ARMSX2TuneGT4Trigger(right_trigger);
                  const float pedal_right_y = left_pedal - right_pedal;'''

              sdl = pedal_math.sub(tuned_pedal_math, sdl)

              # Apply steering tuning only to LEFT STICK X, before stock
              # PCSX2 generic binding dispatch.
              function_anchor = (
                  'bool SDLInputSource::HandleGamepadAxisEvent('
                  'const SDL_GamepadAxisEvent* ev)'
              )
              function_pos = sdl.find(function_anchor)
              if function_pos < 0:
                  raise SystemExit(
                      'Analog tuning V9.3.1: HandleGamepadAxisEvent changed upstream.'
                  )

              value_re = re.compile(
                  r'const float value = NormalizeS16\(ev->value\);'
              )
              value_match = value_re.search(sdl, function_pos)
              if not value_match:
                  raise SystemExit(
                      'Analog tuning V9.3.1: stock normalized SDL axis value '
                      'declaration changed upstream.'
                  )

              steering_value = '''float value = NormalizeS16(ev->value);
              if (ev->axis == SDL_GAMEPAD_AXIS_LEFTX)
              {
                  const float deadzone = ARMSX2AnalogTuningEnv(
                      "ARMSX2_LEFT_STEERING_DEADZONE", 0.0f);
                  const float full_threshold = ARMSX2AnalogTuningEnv(
                      "ARMSX2_LEFT_STEERING_FULL_THRESHOLD", 1.0f);

                  value = ARMSX2ApplyDeadzoneThreshold(
                      value, deadzone, full_threshold);
              }'''

              sdl = (
                  sdl[:value_match.start()] +
                  steering_value +
                  sdl[value_match.end():]
              )

              sdl_path.write_text(sdl)

          print('Analog tuning V9.3.1 UI hotfix patched successfully.')
          print(f'  Inline expandable controls: {swift_path}')
          print(f'  Cold-launch tuning persistence: {scene_path}')
          print(f'  Native steering/pedal tuning: {sdl_path}')
          PY

      - name: Verify GT4 analog trigger pedals V9.2
        shell: bash
        run: |
          set -euo pipefail

          echo 'Game Controller UI wiring:'
          grep -n -A40 -B5 'ARMSX2_IOS16_GT4_TRIGGER_PEDALS' \
            platforms/ios/app/src/main/swift/Views/Settings/GamepadSettingsView.swift
          echo

          echo 'Held-poll direct PS2 injection wiring:'
          grep -n -A185 -B10 'ARMSX2_IOS16_GT4_TRIGGER_PEDALS_HELD_POLL_V92' \
            pcsx2/Input/SDLInputSource.cpp
          echo

          grep -q 'void SDLInputSource::PollEvents()' pcsx2/Input/SDLInputSource.cpp
          grep -q 'SDL_GetGamepadAxis(cd.gamepad, SDL_GAMEPAD_AXIS_LEFT_TRIGGER)' pcsx2/Input/SDLInputSource.cpp
          grep -q 'SDL_GetGamepadAxis(cd.gamepad, SDL_GAMEPAD_AXIS_RIGHT_TRIGGER)' pcsx2/Input/SDLInputSource.cpp
          grep -q 'ARMSX2GT4SetPS2RightStickY(' pcsx2/Input/SDLInputSource.cpp
          grep -q 'Pad::SetControllerState(pad_index, up_bind, up_value);' pcsx2/Input/SDLInputSource.cpp
          grep -q 'Pad::SetControllerState(pad_index, down_bind, down_value);' pcsx2/Input/SDLInputSource.cpp

          python3 - <<'PY'
          def pedal_y(l2: int, r2: int):
              l2 = max(0, min(32767, l2))
              r2 = max(0, min(32767, r2))
              y = (l2 - r2) / 32767.0
              up = max(-y, 0.0)
              down = max(y, 0.0)
              return y, up, down

          cases = [
              ('R2 25%', 0, 8192),
              ('R2 50%', 0, 16384),
              ('R2 100%', 0, 32767),
              ('L2 25%', 8192, 0),
              ('L2 50%', 16384, 0),
              ('L2 100%', 32767, 0),
              ('equal', 15000, 15000),
          ]

          for name, l2, r2 in cases:
              y, up, down = pedal_y(l2, r2)
              if up > 0.0 and down > 0.0:
                  raise SystemExit(f'Invalid dual half-axis state for {name}')
              print(
                  f'{name:8s}: L2={l2:5d} R2={r2:5d} '
                  f'Y={y:+.4f} RUp={up:.4f} RDown={down:.4f}'
              )

          # Behavioral invariant of V9.2:
          # a held trigger is sampled every PollEvents() call, so identical
          # physical input must reproduce identical PS2 output indefinitely.
          held = [pedal_y(0, 16384) for _ in range(120)]
          if any(sample != held[0] for sample in held):
              raise SystemExit('Held-state persistence regression test failed.')

          print()
          print('Held-state persistence model: 120/120 identical polls: OK')
          print('V9.2 direct held-trigger polling verification passed.')
          PY

      - name: Verify analog tuning V9.3.1
        shell: bash
        run: |
          set -euo pipefail

          echo 'Inline iOS 16 tuning UI:'
          grep -n -A190 -B10 'ARMSX2_IOS16_ANALOG_TUNING_INLINE_V931' \
            platforms/ios/app/src/main/swift/Views/Settings/GamepadSettingsView.swift
          echo

          echo 'Native tuning path:'
          grep -n -A130 -B8 'ARMSX2_IOS16_ANALOG_TUNING_NATIVE_V931' \
            pcsx2/Input/SDLInputSource.cpp
          echo

          # Freeze regression guard: V9.3.1 must not add tuning NavigationLinks.
          if grep -n 'ARMSX2LeftSteeringTuningView\|ARMSX2GT4PedalTuningView' \
              platforms/ios/app/src/main/swift/Views/Settings/GamepadSettingsView.swift; then
            echo 'ERROR: old V9.3 nested tuning destination views are present.' >&2
            exit 1
          fi

          grep -q 'DisclosureGroup' \
            platforms/ios/app/src/main/swift/Views/Settings/GamepadSettingsView.swift
          grep -q 'Left Stick Steering' \
            platforms/ios/app/src/main/swift/Views/Settings/GamepadSettingsView.swift
          grep -q 'GT4 Trigger Response' \
            platforms/ios/app/src/main/swift/Views/Settings/GamepadSettingsView.swift

          grep -q 'ARMSX2ApplyDeadzoneThreshold' pcsx2/Input/SDLInputSource.cpp
          grep -q 'ARMSX2TuneGT4Trigger' pcsx2/Input/SDLInputSource.cpp
          grep -q 'ev->axis == SDL_GAMEPAD_AXIS_LEFTX' pcsx2/Input/SDLInputSource.cpp
          grep -q 'Pad::SetControllerState(pad_index, up_bind, up_value);' \
            pcsx2/Input/SDLInputSource.cpp
          grep -q 'Pad::SetControllerState(pad_index, down_bind, down_value);' \
            pcsx2/Input/SDLInputSource.cpp

          python3 - <<'PY'
          def tune(value, deadzone, full_threshold):
              deadzone = max(0.0, min(0.49, deadzone))
              full_threshold = max(0.50, min(1.0, full_threshold))
              if full_threshold <= deadzone + 0.01:
                  full_threshold = deadzone + 0.01

              sign = -1.0 if value < 0.0 else 1.0
              magnitude = abs(value)

              if magnitude <= deadzone:
                  return 0.0
              if magnitude >= full_threshold:
                  return sign

              return sign * (
                  (magnitude - deadzone) /
                  (full_threshold - deadzone)
              )

          # Golden behavior invariant.
          for sample in [-1.0, -0.75, -0.5, -0.1, 0.0, 0.1, 0.5, 0.75, 1.0]:
              actual = tune(sample, 0.0, 1.0)
              if abs(actual - sample) > 1e-7:
                  raise SystemExit(
                      f'V9.2 default transparency failed: {sample} -> {actual}'
                  )

          # Example: DZ 10%, full 80%.
          expected = {
              0.05: 0.0,
              0.10: 0.0,
              0.45: 0.5,
              0.80: 1.0,
              -0.45: -0.5,
              -0.80: -1.0,
          }
          for raw, exp in expected.items():
              actual = tune(raw, 0.10, 0.80)
              if abs(actual - exp) > 1e-7:
                  raise SystemExit(
                      f'V9.3.1 tuning math failed: {raw} -> {actual}, expected {exp}'
                  )

          print('No nested tuning NavigationLink destinations: OK')
          print('Inline DisclosureGroup UI: OK')
          print('0% / 100% golden V9.2 transparency: OK')
          print('Steering/pedal linear tuning math: OK')
          print('V9.3.1 verification passed.')
          PY

      - name: Show remaining iOS 17 source markers
        shell: bash
        run: |
          echo 'Remaining explicit Observation / iOS17 markers (diagnostic only):'
          grep -RInE '@Observable|@ObservationIgnored|@Bindable|MagnifyGesture\(|ContentUnavailableView\(|\.symbolEffect\(|\.contentMargins\(|\.scrollBounceBehavior\(|\.presentationCornerRadius\(' platforms/ios/app/src/main/swift || true

      - name: Build unsigned iOS 16 IPA
        id: build
        continue-on-error: true
        shell: bash
        run: |
          rm -rf platforms/ios/build-ios-xcode
          ./platforms/ios/scripts/build-ios-ipa.sh

      - name: Verify deployment target
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          APP='platforms/ios/build-ios-xcode/Release-iphoneos/ARMSX2iOS.app'
          BIN="$APP/ARMSX2iOS"
          echo 'Info.plist MinimumOSVersion:'
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist" || true
          echo
          echo 'Mach-O build version:'
          xcrun vtool -show-build "$BIN"
          echo
          if ! xcrun vtool -show-build "$BIN" | grep -Eq 'minos[[:space:]]+16(\.0+)?'; then
            echo 'ERROR: Mach-O executable does not report iOS 16.x as minos.' >&2
            exit 1
          fi

      - name: Upload IPA
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ARMSX2-iOS16-unsigned-v9.3.1
          path: platforms/ios/build-ios-xcode/ARMSX2-iOS-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ARMSX2-iOS16-build-log-v9.3.1
          path: platforms/ios/build-ios-xcode/xcodebuild.log
          if-no-files-found: ignore

      - name: Fail if source build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo 'The iOS 16 V9.3.1 analog-tuning UI-hotfix build reached a compiler/linker blocker. Download ARMSX2-iOS16-build-log-v9.3.1 and inspect the first real error.' >&2
          exit 1
