                              Button("Reset Pedal Tuning") {
                                  gt4TriggerDeadzone = 0.0
                                  gt4TriggerFullThreshold = 1.0
                                  armsx2SetAnalogFloatEnvironment(
                                      "ARMSX2_GT4_TRIGGER_DEADZONE", 0.0
                                  )
                                  armsx2SetAnalogFloatEnvironment(
                                      "ARMSX2_GT4_TRIGGER_FULL_THRESHOLD", 1.0
                                  )
