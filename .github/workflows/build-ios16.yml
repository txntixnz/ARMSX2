                              Button("Reset Steering Tuning") {
                                  leftSteeringDeadzone = 0.0
                                  leftSteeringFullThreshold = 1.0
                                  armsx2SetAnalogFloatEnvironment(
                                      "ARMSX2_LEFT_STEERING_DEADZONE", 0.0
                                  )
                                  armsx2SetAnalogFloatEnvironment(
                                      "ARMSX2_LEFT_STEERING_FULL_THRESHOLD", 1.0
                                  )
                              }
                          }
                          .padding(.vertical, 6)
                      } label: {
