                  )

              helper = '''// ARMSX2_IOS16_ANALOG_TUNING_INLINE_V931
          private func armsx2SetAnalogFloatEnvironment(_ key: String, _ value: Double) {
              key.withCString { rawKey in
                  String(value).withCString { rawValue in
                      _ = setenv(rawKey, rawValue, 1)
                  }
              }
          }

          '''
              swift = swift.replace(struct_anchor, helper + struct_anchor, 1)

              # Find the existing V9.2 GT4 AppStorage property robustly.
              storage_re = re.compile(
                  r'([ \t]*@AppStorage\("ARMSX2_GT4TriggerPedals"\)'
