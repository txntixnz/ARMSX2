                          }
                          .padding(.vertical, 6)
                      } label: {
                          Label {
                              VStack(alignment: .leading, spacing: 3) {
                                  Text("GT4 Trigger Response")
                                  Text("R2 throttle · L2 brake tuning")
                                      .font(.caption)
                                      .foregroundColor(.secondary)
                              }
                          } icon: {
                              Image(systemName: "gauge")
