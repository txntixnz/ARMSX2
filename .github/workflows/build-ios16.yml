                                  ),
                                  in: 0.50...1.00,
                                  step: 0.01
                              )

                              Text("Trigger Deadzone controls how far R2/L2 move before throttle or brake begins. Full Trigger Threshold controls how far the trigger must travel before the emulator receives 100%.")
                                  .font(.caption)
